User:

  allOf:

    - $ref: "./common.yaml#/AuditFields"

    - type: object

      properties:

        firstName:
          type: string

        lastName:
          type: string

        email:
          type: string
          format: email

        phone:
          type: string

        avatar:
          type: string
          nullable: true

        isActive:
          type: boolean

        roles:

          type: array

          items:

            $ref: "./role.yaml#/Role"
UUID:
  name: uuid
  in: path
  required: true
  description: Resource UUID
  schema:
    type: string
    format: uuid

Page:
  name: page
  in: query
  required: false
  description: Page number
  schema:
    type: integer
    minimum: 1
    default: 1

Limit:
  name: limit
  in: query
  required: false
  description: Number of records per page
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10

Search:
  name: search
  in: query
  required: false
  description: Search keyword
  schema:
    type: string

SortBy:
  name: sortBy
  in: query
  required: false
  description: Sort field
  schema:
    type: string

SortOrder:
  name: sortOrder
  in: query
  required: false
  description: Sort direction
  schema:
    type: string
    enum:
      - asc
      - desc
    default: desc